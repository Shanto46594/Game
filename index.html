<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLAY HUB | অনলাইন গেমস</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #ffffff;
            text-align: center;
        }

        header {
            background: #161b22;
            padding: 20px;
            border-bottom: 2px solid #238636;
        }

        h1 {
            color: #2ea043;
            margin-bottom: 5px;
        }

        .game-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 30px 10px;
        }

        .game-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            width: 320px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .game-card h2 {
            color: #58a6ff;
            margin-bottom: 15px;
        }

        /* Tic Tac Toe UI */
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            margin: 15px auto;
            width: 200px;
            height: 200px;
        }

        .cell {
            background: #21262d;
            border: 1px solid #30363d;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #f0f6fc;
        }

        /* Snake Game UI */
        canvas {
            background: #000000;
            border: 2px solid #30363d;
            margin-top: 10px;
        }

        /* Number Game UI */
        input[type="number"] {
            padding: 8px;
            width: 80%;
            margin-bottom: 10px;
            border-radius: 5px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: #fff;
            text-align: center;
        }

        button {
            background: #238636;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
        }

        button:hover {
            background: #2ea043;
        }

        p.status {
            margin-top: 10px;
            font-size: 14px;
            color: #8b949e;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎮 PLAY HUB</h1>
        <p>ওয়েবসাইটে বসেই সরাসরি বিভিন্ন গেম খেলুন!</p>
    </header>

    <div class="game-container">

        <!-- Game 1: Tic Tac Toe -->
        <div class="game-card">
            <h2>১. টিক-ট্যাক-টো (X / O)</h2>
            <div class="board" id="board">
                <div class="cell" onclick="makeMove(0)"></div>
                <div class="cell" onclick="makeMove(1)"></div>
                <div class="cell" onclick="makeMove(2)"></div>
                <div class="cell" onclick="makeMove(3)"></div>
                <div class="cell" onclick="makeMove(4)"></div>
                <div class="cell" onclick="makeMove(5)"></div>
                <div class="cell" onclick="makeMove(6)"></div>
                <div class="cell" onclick="makeMove(7)"></div>
                <div class="cell" onclick="makeMove(8)"></div>
            </div>
            <p class="status" id="ttt-status">X-এর চাল</p>
            <button onclick="resetTTT()">পুনরায় শুরু</button>
        </div>

        <!-- Game 2: Snake Game -->
        <div class="game-card">
            <h2>২. ক্লাসিক স্নেক গেম</h2>
            <canvas id="snakeCanvas" width="200" height="200"></canvas>
            <p class="status">কন্ট্রোল: Arrow Keys (তীর চিহ্ন)</p>
            <button onclick="startSnake()">গেম স্টার্ট / রিসেট</button>
        </div>

        <!-- Game 3: Guessing Game -->
        <div class="game-card">
            <h2>৩. নম্বর জাস্টিস (১-২০)</h2>
            <p style="font-size:13px; color:#8b949e; margin-bottom:10px;">১ থেকে ২০ এর মধ্যে সঠিক নম্বরটি অনুমান করুন</p>
            <input type="number" id="guessInput" placeholder="সংখ্যা লিখুন">
            <button onclick="checkGuess()">যাচাই করুন</button>
            <p class="status" id="guess-status"></p>
        </div>

    </div>

    <script>
        /* --- 1. Tic Tac Toe Logic --- */
        let tttBoard = ['', '', '', '', '', '', '', '', ''];
        let currentPlayer = 'X';
        let tttActive = true;

        function makeMove(index) {
            if (tttBoard[index] === '' && tttActive) {
                tttBoard[index] = currentPlayer;
                document.getElementsByClassName('cell')[index].innerText = currentPlayer;
                if (checkTTTWinner()) {
                    document.getElementById('ttt-status').innerText = 'খেলোয়াড় ' + currentPlayer + ' জিতেছে!';
                    tttActive = false;
                } else if (!tttBoard.includes('')) {
                    document.getElementById('ttt-status').innerText = 'ম্যাচ ড্র হয়েছে!';
                } else {
                    currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                    document.getElementById('ttt-status').innerText = currentPlayer + '-এর চাল';
                }
            }
        }

        function checkTTTWinner() {
            const wins = [
                [0,1,2],[3,4,5],[6,7,8],
                [0,3,6],[1,4,7],[2,5,8],
                [0,4,8],[2,4,6]
            ];
            return wins.some(comb => {
                return comb.every(i => tttBoard[i] === currentPlayer);
            });
        }

        function resetTTT() {
            tttBoard = ['', '', '', '', '', '', '', '', ''];
            currentPlayer = 'X';
            tttActive = true;
            document.getElementById('ttt-status').innerText = 'X-এর চাল';
            let cells = document.getElementsByClassName('cell');
            for(let cell of cells) cell.innerText = '';
        }

        /* --- 2. Snake Game Logic --- */
        const canvas = document.getElementById("snakeCanvas");
        const ctx = canvas.getContext("2d");
        let snake, food, dx, dy, gameInterval;

        function startSnake() {
            clearInterval(gameInterval);
            snake = [{x: 100, y: 100}];
            food = {x: 60, y: 60};
            dx = 10; dy = 0;
            gameInterval = setInterval(updateSnake, 150);
        }

        document.addEventListener("keydown", changeDirection);

        function changeDirection(event) {
            const key = event.keyCode;
            if (key === 37 && dx === 0) { dx = -10; dy = 0; }
            if (key === 38 && dy === 0) { dx = 0; dy = -10; }
            if (key === 39 && dx === 0) { dx = 10; dy = 0; }
            if (key === 40 && dy === 0) { dx = 0; dy = 10; }
        }

        function updateSnake() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            if (head.x < 0 || head.x >= 200 || head.y < 0 || head.y >= 200) {
                clearInterval(gameInterval);
                alert("গেম ওভার!");
                return;
            }

            snake.unshift(head);
            if (head.x === food.x && head.y === food.y) {
                food = {
                    x: Math.floor(Math.random() * 19) * 10,
                    y: Math.floor(Math.random() * 19) * 10
                };
            } else {
                snake.pop();
            }

            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, 200, 200);

            ctx.fillStyle = "red";
            ctx.fillRect(food.x, food.y, 10, 10);

            ctx.fillStyle = "lime";
            snake.forEach(part => ctx.fillRect(part.x, part.y, 10, 10));
        }

        /* --- 3. Guessing Game Logic --- */
        let targetNumber = Math.floor(Math.random() * 20) + 1;

        function checkGuess() {
            let userGuess = parseInt(document.getElementById("guessInput").value);
            let status = document.getElementById("guess-status");

            if (userGuess === targetNumber) {
                status.style.color = "#2ea043";
                status.innerText = "অভিনন্দন! সঠিক সংখ্যাটি ছিল " + targetNumber;
                targetNumber = Math.floor(Math.random() * 20) + 1;
            } else if (userGuess > targetNumber) {
                status.style.color = "#f85149";
                status.innerText = "খুব বড় সংখ্যা! ছোট চেষ্টা করুন।";
            } else if (userGuess < targetNumber) {
                status.style.color = "#f85149";
                status.innerText = "খুব ছোট সংখ্যা! বড় চেষ্টা করুন।";
            }
        }
    </script>
</body>
                </html>
